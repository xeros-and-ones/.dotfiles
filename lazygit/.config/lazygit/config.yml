# yaml-language-server: $schema=https://json.schemastore.org/lazygit.json
gui:
  expandFocusedSidePanel: true
  nerdFontsVersion: "3"
  border: "rounded"
  theme:
    selectedLineBgColor:
      - black
      - bold
    selectedRangeBgColor:
      - green
      - bold
git:
  diffRenderers:
    - colorArg: always
      # pager: delta --dark --paging=never

      type: rawGit
os:
  editPreset: "emacs"
